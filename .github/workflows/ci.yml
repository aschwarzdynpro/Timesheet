name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    name: Typecheck, Lint, Tests, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx vite build

  database:
    name: Migrationen und Datenbanktests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ['5432:5432']
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: psql bereitstellen
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrationen einspielen und Tests laufen lassen
        run: ./scripts/test-db.sh
